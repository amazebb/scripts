name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # the scripts target macOS (BSD find/stat, launchd), so test there
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install bash coreutils gawk gnuplot exiftool
          {
            echo "$(brew --prefix)/bin"
            echo "$(brew --prefix coreutils)/libexec/gnubin"
          } >> "$GITHUB_PATH"

      - name: Run tests
        run: tests/run.sh
